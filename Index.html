<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUKEY — Draw to Unlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS
   Primary target: 1920x1080 desktop / event-booth display.
   Layout centers on a fixed-feel stage but scales gracefully if the
   browser window is resized (not mobile-first, per spec section 7).
===================================================================== */
:root{
  --bg-deep:#081917;
  --bg-mid:#0d2622;
  --teal:#17b6a4;
  --teal-bright:#5eead4;
  --teal-dim:#0a4c49;
  --amber:#f2a65a;
  --ink:#eafbf7;
  --ink-dim:#8fb8b1;
  --panel:#0d2622;
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:var(--bg-deep);
  font-family:'Prompt',sans-serif;
  color:var(--ink);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* =====================================================================
   STAGE / BACKGROUND FX
===================================================================== */
#app{
  position:relative;
  width:100%; height:100vh; min-height:640px;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 50% 15%, rgba(94,234,212,0.10), transparent 55%),
    radial-gradient(circle at 50% 100%, rgba(23,182,164,0.14), transparent 60%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
}
#bg-grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(94,234,212,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(94,234,212,0.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 45%, black 0%, transparent 72%);
  pointer-events:none;
}
#bg-particles{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.spark{
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:var(--teal-bright); opacity:0.5;
  animation:floatUp 8s linear infinite;
}
@keyframes floatUp{
  0%{ transform:translateY(0); opacity:0; }
  10%{ opacity:.6; }
  90%{ opacity:.25; }
  100%{ transform:translateY(-92vh); opacity:0; }
}

/* =====================================================================
   BRAND HEADER (always visible, low-key)
===================================================================== */
#brandHeader{
  position:absolute; top:28px; left:50%; transform:translateX(-50%);
  font-size:13px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--teal-bright); opacity:.7; font-weight:600;
  pointer-events:none;
}

/* =====================================================================
   MAIN PLAY FIELD
   Holds mascot + unlock symbol + speech bubble + canvas, all layered
   and positioned/morphed per state via body[data-state="..."] rules.
===================================================================== */
#playField{
  position:relative;
  width:min(92vw, 1100px);
  height:min(84vh, 820px);
}

/* ---- Unlock More symbol -------------------------------------------- */
/* A single persistent element that changes position/scale/color across
   states, so it reads as "the same object being unlocked" throughout
   the story rather than three unrelated graphics. Icon + text label
   are separate children so the label can be hidden during the drawing
   watermark treatment without affecting the icon. */
#unlockSymbol{
  position:absolute;
  left:50%; top:50%;
  width:110px; height:110px;
  transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:8px;
  transition:
    left 1s cubic-bezier(.4,0,.2,1),
    top 1s cubic-bezier(.4,0,.2,1),
    width 1s cubic-bezier(.4,0,.2,1),
    height 1s cubic-bezier(.4,0,.2,1),
    opacity .8s ease;
  opacity:0.85;
  z-index:2;
  pointer-events:none;
}
#unlockSymbol .unlock-icon-wrap{
  position:relative;
  width:44%; aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center;
}
#unlockSymbol img{
  width:100%; height:100%; object-fit:contain; display:block;
  filter:grayscale(100%) brightness(0.75);
  transition:filter .8s ease;
}
#unlockSymbol .unlock-rays{
  position:absolute; inset:-60%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(94,234,212,0.55), transparent 70%);
  opacity:0;
  transition:opacity .6s ease;
}
#unlockSymbol .unlock-label{
  font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  line-height:1.25; text-align:center;
  color:var(--ink-dim);
  transition:color .8s ease, text-shadow .8s ease;
}
#unlockSymbol.is-unlocked{ opacity:1; }
#unlockSymbol.is-unlocked img{
  filter:grayscale(0%) brightness(1.1) saturate(1.25) drop-shadow(0 0 18px rgba(94,234,212,0.8));
}
#unlockSymbol.is-unlocked .unlock-rays{ opacity:1; animation:rayPulse 2.2s ease-in-out infinite; }
#unlockSymbol.is-unlocked .unlock-label{
  color:var(--teal-bright);
  text-shadow:0 0 14px rgba(94,234,212,0.6);
}
#unlockSymbol.is-unlocked .unlock-icon-wrap{ animation:symbolPulse 2.2s ease-in-out infinite; }
@keyframes symbolPulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.1); }
}
@keyframes rayPulse{
  0%,100%{ opacity:.55; transform:scale(1); }
  50%{ opacity:.9; transform:scale(1.15); }
}

/* Per-state position/size of the symbol */
body[data-state="intro"]   #unlockSymbol,
body[data-state="ready"]   #unlockSymbol{
  left:50%; top:15%; width:420px; height:420px;
}
body[data-state="drawing"]   #unlockSymbol,
body[data-state="analyzing"] #unlockSymbol{
  left:50%; top:46%; width:130px; height:130px;
  opacity:0.16;
}
body[data-state="drawing"]   #unlockSymbol .unlock-label,
body[data-state="analyzing"] #unlockSymbol .unlock-label{
  display:none; /* icon only, as a faint watermark behind the canvas */
}
body[data-state="drawing"]   #unlockSymbol .unlock-icon-wrap,
body[data-state="analyzing"] #unlockSymbol .unlock-icon-wrap{
  width:100%;
}
body[data-state="success"] #unlockSymbol,
body[data-state="fail"]    #unlockSymbol{
  left:50%; top:14%; width:320px; height:320px;
}

/* ---- Mascot ---------------------------------------------------------- */
#mascotStage{
  position:absolute;
  left:50%; top:62%;
  width:280px; height:320px;
  transform:translate(-50%,-50%);
  transition:left 1s ease, top 1s ease, width .8s ease, height .8s ease, opacity .6s ease;
  display:flex; align-items:flex-end; justify-content:center;
  z-index:3;
  pointer-events:none;
}
#mascotStage .ground-glow{
  position:absolute; bottom:-4%; left:20%;
  width:60%; height:14%;
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(94,234,212,0.32), transparent 72%);
  filter:blur(2px);
  animation:groundPulse 3.2s ease-in-out infinite;
}
@keyframes groundPulse{
  0%,100%{ transform:scale(1); opacity:.7; }
  50%{ transform:scale(0.82); opacity:.4; }
}
#mascotImg{
  position:relative;
  height:100%; width:auto;
  object-fit:contain;
  filter:grayscale(35%) brightness(0.7) saturate(0.75) drop-shadow(0 6px 14px rgba(0,0,0,0.35));
  transition:filter .8s ease;
  animation:idleDroop 3.6s ease-in-out infinite;
  transform-origin:50% 85%;
}
#mascotImg.is-energized{
  filter:grayscale(0%) brightness(1.08) saturate(1.3) drop-shadow(0 0 24px rgba(94,234,212,0.55));
  animation:idleBounce 1.7s cubic-bezier(.34,1.56,.64,1) infinite;
}
#mascotImg.shake-fail{
  animation:shakeNo .6s ease-in-out, idleDroop 3.6s ease-in-out infinite .6s;
}
@keyframes idleDroop{
  0%{ transform:translateY(0) rotate(-1deg); }
  50%{ transform:translateY(6px) rotate(1deg); }
  100%{ transform:translateY(0) rotate(-1deg); }
}
@keyframes idleBounce{
  0%{ transform:translateY(0) scale(1,1) rotate(0deg); }
  18%{ transform:translateY(-13px) scale(1.03,0.96) rotate(-2deg); }
  38%{ transform:translateY(0) scale(0.97,1.04) rotate(2deg); }
  58%{ transform:translateY(-8px) scale(1.015,0.985) rotate(-1deg); }
  78%{ transform:translateY(0) rotate(1deg); }
  100%{ transform:translateY(0) rotate(0deg); }
}
@keyframes shakeNo{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  20%{ transform:translateY(0) rotate(-4deg); }
  40%{ transform:translateY(0) rotate(4deg); }
  60%{ transform:translateY(0) rotate(-3deg); }
  80%{ transform:translateY(0) rotate(3deg); }
}
/* sparkle orbit shown only on success */
#sparkleOrbit{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .5s ease;
  pointer-events:none;
}
#sparkleOrbit.on{ opacity:1; }
#sparkleOrbit span{
  position:absolute; width:6px; height:6px; border-radius:50%;
  background:var(--teal-bright);
  box-shadow:0 0 8px rgba(94,234,212,0.9);
  top:50%; left:50%;
  animation:orbitSpin 3.2s linear infinite;
}
#sparkleOrbit span:nth-child(2){ animation-delay:-1.06s; }
#sparkleOrbit span:nth-child(3){ animation-delay:-2.13s; }
@keyframes orbitSpin{
  0%{ transform:translate(-50%,-50%) rotate(0deg) translateX(110px) rotate(0deg); }
  100%{ transform:translate(-50%,-50%) rotate(360deg) translateX(110px) rotate(-360deg); }
}

/* Per-state mascot position */
body[data-state="intro"] #mascotStage,
body[data-state="ready"] #mascotStage{
  left:50%; top:68%; width:245px; height:275px; opacity:1;
}
body[data-state="drawing"] #mascotStage,
body[data-state="analyzing"] #mascotStage{
  left:12%; top:82%; width:150px; height:170px; opacity:.55;
}
body[data-state="success"] #mascotStage,
body[data-state="fail"] #mascotStage{
  left:50%; top:53%; width:220px; height:250px; opacity:1;
}

/* ---- Responsive layout ------------------------------------------------
   The original intro symbol was 420px tall at 15% of the play field,
   which placed it behind the brand header on short screens. Keep each
   intro element in its own vertical band: header, symbol, dialogue,
   then mascot. */
body[data-state="intro"] #unlockSymbol,
body[data-state="ready"] #unlockSymbol{
  top:22%;
  width:250px;
  height:250px;
}
body[data-state="intro"] #mascotStage,
body[data-state="ready"] #mascotStage{
  /* Keep the mascot close to the dialogue while leaving room for START. */
  top:68%;
}
body[data-state="fail"] #unlockSymbol,
body[data-state="success"] #unlockSymbol{
  top:22%;
  width:250px;
  height:250px;
}
body[data-state="fail"] #mascotStage,
body[data-state="success"] #mascotStage{
  top:62%;
}

@media (max-width: 768px){
  #app{
    min-height:100svh;
    height:auto;
    padding:72px 0 20px;
  }
  #brandHeader{
    top:18px;
    width:100%;
    text-align:center;
    font-size:11px;
  }
  #playField{
    width:min(94vw, 560px);
    height:calc(100svh - 92px);
    min-height:540px;
  }
  body[data-state="intro"] #unlockSymbol,
  body[data-state="ready"] #unlockSymbol{
    top:18%;
    width:225px;
    height:225px;
  }
  #speechBubble{
    top:38%;
    width:min(94%, 420px);
    padding:12px 16px;
    font-size:14px;
    line-height:1.45;
  }
  body[data-state="intro"] #mascotStage,
  body[data-state="ready"] #mascotStage{
    top:66%;
    width:180px;
    height:205px;
  }
  body[data-state="fail"] #unlockSymbol,
  body[data-state="success"] #unlockSymbol{
    top:19%;
    width:215px;
    height:215px;
  }
  body[data-state="fail"] #mascotStage,
  body[data-state="success"] #mascotStage{
    top:60%;
    width:180px;
    height:205px;
  }
  #btnStart{ bottom:0; }
  #drawCanvasWrap{
    width:min(82vw, 420px);
    height:min(82vw, 420px);
  }
  #drawInstruction{ top:3%; width:100%; }
  #drawInstruction .th{ font-size:17px; }
  #drawHereLabel{ bottom:-52px; }
  #drawHereLabel span{ font-size:12px; }
  body[data-state="drawing"] #mascotStage,
  body[data-state="analyzing"] #mascotStage{ display:none; }
  #resultPanel{ bottom:0; }
}

@media (max-width: 768px) and (max-height: 650px){
  #app{ padding-top:58px; }
  #brandHeader{ top:14px; }
  #playField{ height:calc(100svh - 70px); min-height:480px; }
  body[data-state="intro"] #unlockSymbol,
  body[data-state="ready"] #unlockSymbol{
    top:16%;
    width:200px;
    height:200px;
  }
  #speechBubble{ top:35%; font-size:13px; padding:10px 14px; }
  body[data-state="intro"] #mascotStage,
  body[data-state="ready"] #mascotStage{
    top:70%;
    width:150px;
    height:165px;
  }
  body[data-state="fail"] #unlockSymbol,
  body[data-state="success"] #unlockSymbol{
    top:17%;
    width:190px;
    height:190px;
  }
  body[data-state="fail"] #mascotStage,
  body[data-state="success"] #mascotStage{
    top:59%;
    width:155px;
    height:175px;
  }
}

/* ---- Speech bubble ---------------------------------------------------- */
#speechBubble{
  position:absolute;
  left:50%; top:34%;
  width:min(90%, 460px);
  transform:translate(-50%,0);
  padding:16px 22px;
  background:rgba(244,249,248,0.97);
  color:#0c211d;
  border-radius:18px;
  font-size:17px; line-height:1.55; font-weight:500; text-align:center;
  white-space:pre-line;
  box-shadow:0 12px 32px rgba(0,0,0,0.35);
  opacity:0; transition:opacity .45s ease, transform .45s ease;
  z-index:4;
}
#speechBubble.show{ opacity:1; }
#speechBubble::after{
  content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
  width:0; height:0;
  border-left:9px solid transparent; border-right:9px solid transparent;
  border-top:9px solid rgba(244,249,248,0.97);
}
body[data-state="drawing"] #speechBubble,
body[data-state="analyzing"] #speechBubble,
body[data-state="success"] #speechBubble,
body[data-state="fail"] #speechBubble{ display:none; }

/* ---- Start button + draw instruction ---------------------------------- */
.btn{
  appearance:none; border:none; cursor:pointer;
  font-family:'Prompt',sans-serif; font-weight:700; font-size:17px;
  letter-spacing:.04em;
  color:#04211c;
  background:linear-gradient(180deg, var(--teal-bright), var(--teal));
  padding:16px 46px;
  border-radius:999px;
  box-shadow:0 10px 26px rgba(23,182,164,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
  transition:transform .15s ease, box-shadow .15s ease, opacity .4s ease;
}
.btn:hover{ transform:translateY(-2px); box-shadow:0 14px 30px rgba(23,182,164,0.45); }
.btn:active{ transform:translateY(1px) scale(.98); }
.btn.ghost{
  background:transparent; color:var(--teal-bright);
  border:1.5px solid rgba(94,234,212,0.55); box-shadow:none;
}

#btnStart{
  position:absolute; left:50%; bottom:2%;
  transform:translateX(-50%);
  opacity:0; pointer-events:none;
  z-index:4;
}
body[data-state="ready"] #btnStart{ opacity:1; pointer-events:auto; }

#drawInstruction{
  position:absolute; left:50%; top:8%;
  transform:translateX(-50%);
  text-align:center;
  opacity:0; transition:opacity .4s ease;
  z-index:4; pointer-events:none;
}
#drawInstruction .th{ font-size:20px; font-weight:600; color:var(--teal-bright); }
#drawInstruction .en{ font-size:13px; color:var(--ink-dim); margin-top:2px; }
body[data-state="drawing"] #drawInstruction{ opacity:1; }

/* ---- Drawing canvas ---------------------------------------------------- */
#drawCanvasWrap{
  position:absolute; left:50%; top:46%;
  width:min(50vw, 480px); height:min(50vw, 480px);
  transform:translate(-50%,-50%);
  opacity:0; pointer-events:none;
  transition:opacity .4s ease;
  z-index:3;
}
body[data-state="drawing"] #drawCanvasWrap{ opacity:1; pointer-events:auto; }
#drawCanvas{
  width:100%; height:100%;
  cursor:crosshair;
  touch-action:none;
  border-radius:50%;
  border:3px dashed rgba(143,184,177,0.45);
  background:radial-gradient(circle, rgba(94,234,212,0.05), transparent 70%);
}
#drawHereLabel{
  position:absolute; left:50%; bottom:-64px;
  transform:translateX(-50%);
  width:100%;
  text-align:center;
  opacity:0; transition:opacity .4s ease;
  pointer-events:none;
}
#drawHereLabel::before{
  content:"";
  display:block;
  width:70%; height:1px; margin:0 auto 14px;
  background:linear-gradient(90deg, transparent, rgba(94,234,212,0.4), transparent);
}
#drawHereLabel span{
  font-size:14px; font-weight:700; letter-spacing:.12em;
  color:var(--teal-bright);
}
body[data-state="drawing"] #drawHereLabel{ opacity:1; }

/* ---- Analyzing overlay -------------------------------------------------- */
#analyzingOverlay{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .3s ease;
  z-index:5;
}
body[data-state="analyzing"] #analyzingOverlay{ opacity:1; }
.spinner{
  width:46px; height:46px; margin:0 auto 14px;
  border-radius:50%;
  border:3px solid rgba(94,234,212,0.25);
  border-top-color:var(--teal-bright);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
#analyzingOverlay .label{
  font-size:15px; letter-spacing:.2em; color:var(--teal-bright); font-weight:600;
}

/* ---- Result panel --------------------------------------------------------- */
#resultPanel{
  position:absolute; left:50%; bottom:-8%;
  transform:translate(-50%,12px);
  width:min(90%,480px);
  text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .5s ease, transform .5s ease;
  z-index:4;
}
body[data-state="success"] #resultPanel,
body[data-state="fail"] #resultPanel{
  opacity:1; transform:translate(-50%,0); pointer-events:auto;
}
#resultTitle{
  font-size:26px; font-weight:800; margin-bottom:4px;
}
#resultTitle.success{ color:var(--teal-bright); text-shadow:0 0 20px rgba(94,234,212,0.5); }
#resultTitle.fail{ color:var(--amber); }
#resultScore{
  font-size:15px; color:var(--ink-dim); margin-bottom:14px; letter-spacing:.05em;
}
#resultScore b{ color:var(--ink); font-size:20px; }
#confettiLayer{ position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:6; }
</style>
</head>
<body data-state="intro">

<div id="app">
  <div id="bg-grid"></div>
  <div id="bg-particles"></div>
  <div id="brandHeader">AUKEY · Draw to Unlock</div>

  <div id="playField">

    <!-- Unlock More symbol: persistent element, morphs across states -->
    <div id="unlockSymbol">
      <div class="unlock-icon-wrap">
        <div class="unlock-rays"></div>
        <img id="unlockSymbolImg" alt="Unlock More icon">
      </div>
      <div class="unlock-label">UNLOCK<br>MORE</div>
    </div>

    <!-- Mascot -->
    <div id="mascotStage">
      <div class="ground-glow"></div>
      <img id="mascotImg" alt="AUKI mascot">
      <div id="sparkleOrbit"><span></span><span></span><span></span></div>
    </div>

    <!-- Intro dialogue -->
    <div id="speechBubble"></div>
    <button id="btnStart" class="btn">START</button>

    <!-- Drawing state -->
    <div id="drawInstruction">
      <div class="th">Draw a circle to unlock the power!</div>
      <div class="en">วาดวงกลมเพื่อปลดล็อกพลัง — คลิกค้างแล้วลากด้วยเมาส์</div>
    </div>
    <div id="drawCanvasWrap">
      <canvas id="drawCanvas"></canvas>
      <div id="drawHereLabel"><span>DRAW HERE ✏️</span></div>
    </div>

    <!-- Analyzing state -->
    <div id="analyzingOverlay">
      <div class="spinner"></div>
      <div class="label">ANALYZING…</div>
    </div>

    <!-- Result state -->
    <div id="resultPanel">
      <div id="resultTitle"></div>
      <div id="resultScore"></div>
      <button id="btnTryAgain" class="btn ghost">TRY AGAIN</button>
    </div>

    <div id="confettiLayer"></div>
  </div>
</div>

<script>
/* =====================================================================
   AUKEY — DRAW TO UNLOCK
   Front-end only prototype. No backend / login / database / AI.
   Organized as small, single-purpose functions grouped by concern:
     1. Ambient FX (decorative, no game logic)
     2. Asset constants
     3. State machine
     4. Mascot component
     5. Unlock-symbol component
     6. Speech / intro dialogue sequence
     7. Drawing canvas component (mouse-only input)
     8. Circle accuracy algorithm (pure math, client-side)
     9. Result / confetti
    10. Wiring (DOMContentLoaded-equivalent bottom-of-body init)
===================================================================== */

/* ---------------------------------------------------------------------
   1. AMBIENT FX
--------------------------------------------------------------------- */
(function initAmbientSparks(){
  const layer = document.getElementById('bg-particles');
  for(let i=0;i<24;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = Math.random()*100+'%';
    s.style.bottom = (-10-Math.random()*20)+'px';
    s.style.animationDelay = (Math.random()*8)+'s';
    s.style.animationDuration = (6+Math.random()*5)+'s';
    layer.appendChild(s);
  }
})();

/* ---------------------------------------------------------------------
   2. ASSET CONSTANTS
   Mascot + Unlock-symbol images are embedded as base64 placeholders
   derived from AUKEY's reference character sheet. Swap these two
   constants with official animated assets later — nothing else in

/* ---------------------------------------------------------------------
   3. STATE MACHINE
   States: intro -> ready -> drawing -> analyzing -> (success | fail)
   fail -> drawing (via Try Again)
   All visibility/positioning per state is handled declaratively in CSS
   via body[data-state="..."] selectors; this function only sets the
   attribute and runs any one-time per-state setup logic.
--------------------------------------------------------------------- */
function setGameState(next){
  document.body.setAttribute('data-state', next);
  STATE_HANDLERS[next] && STATE_HANDLERS[next]();
}

const STATE_HANDLERS = {
  intro: () => { playIntroDialogue(); },
  ready: () => {},
  drawing: () => { resetDrawingCanvas(); },
  analyzing: () => { runCircleAnalysis(); },
  success: () => {},
  fail: () => {},
};

/* ---------------------------------------------------------------------
   4. MASCOT COMPONENT
   setMascotState(name) swaps the mascot's visual treatment. Placeholder
   implementation uses CSS filters + CSS keyframe animations on a single
   image; replace with real per-state animated assets by changing what
   happens inside this function only.
--------------------------------------------------------------------- */
const mascotImgEl = document.getElementById('mascotImg');
const sparkleOrbitEl = document.getElementById('sparkleOrbit');

function setMascotState(name){
  // name: 'tired' | 'talking' | 'talking2' | 'success' | 'fail'
  switch(name){
    case 'tired':
      mascotImgEl.src = ASSET_MASCOT_TIRED;
      mascotImgEl.classList.remove('is-energized');
      sparkleOrbitEl.classList.remove('on');
      break;
    case 'talking':
      mascotImgEl.src = ASSET_MASCOT_TALKING;
      mascotImgEl.classList.remove('is-energized');
      sparkleOrbitEl.classList.remove('on');
      break;
    case 'talking2':
      mascotImgEl.src = ASSET_MASCOT_TALKING2;
      mascotImgEl.classList.remove('is-energized');
      sparkleOrbitEl.classList.remove('on');
      break;
    case 'success':
      mascotImgEl.src = ASSET_MASCOT_SUCCESS;
      mascotImgEl.classList.add('is-energized');
      sparkleOrbitEl.classList.add('on');
      break;
    case 'fail':
      mascotImgEl.src = ASSET_MASCOT_TIRED;
      mascotImgEl.classList.remove('is-energized');
      sparkleOrbitEl.classList.remove('on');
      // restart the one-shot "shake" animation even if already present
      mascotImgEl.classList.remove('shake-fail');
      void mascotImgEl.offsetWidth; // force reflow so the animation restarts
      mascotImgEl.classList.add('shake-fail');
      break;
  }
}

/* ---------------------------------------------------------------------
   5. UNLOCK-SYMBOL COMPONENT
   setUnlockState(name) toggles between locked/inactive and
   unlocked/active visual treatment. Position/size per game state is
   handled by CSS; this only controls the locked <-> unlocked look.
--------------------------------------------------------------------- */
const unlockSymbolEl = document.getElementById('unlockSymbol');

function setUnlockState(name){
  // name: 'locked' | 'unlocked'
  unlockSymbolEl.classList.toggle('is-unlocked', name === 'unlocked');
}

/* ---------------------------------------------------------------------
   6. INTRO DIALOGUE SEQUENCE
   Shows the lines in sequence inside the speech bubble, switching the
   mascot's pose to match each beat (tired -> talking -> talking2),
   then reveals the START button.
--------------------------------------------------------------------- */
const INTRO_LINES = [
  { text: "พลังงานของฉันกำลังจะหมดแล้ว...\n(My energy is running out...)", pose: "talking" },
  { text: "เห็นสัญลักษณ์นี้ไหม?\n(Do you see this symbol?)", pose: "talking2" },
  { text: "ช่วยวาดวงกลมเพื่อปลดล็อกพลังของฉันหน่อยนะ!\n(Please help me draw a circle to unlock my power!)", pose: "talking2" },
];
const bubbleEl = document.getElementById('speechBubble');
const btnStartEl = document.getElementById('btnStart');

function playIntroDialogue(){
  setMascotState('tired');
  setUnlockState('locked');
  btnStartEl.textContent = 'START';
  let i = 0;
  // brief tired-only beat before the mascot starts talking
  setTimeout(showLine, 700);
  function showLine(){
    const line = INTRO_LINES[i];
    setMascotState(line.pose);
    bubbleEl.textContent = line.text;
    bubbleEl.classList.remove('show');
    void bubbleEl.offsetWidth;
    bubbleEl.classList.add('show');
    i++;
    if(i < INTRO_LINES.length){
      setTimeout(showLine, 2400);
    } else {
      setTimeout(showReadyLine, 2200);
    }
  }
  function showReadyLine(){
    setGameState('ready');
  }
}

/* ---------------------------------------------------------------------
   7. DRAWING CANVAS COMPONENT
   Pointer input supports mouse, touch, and pen. One stroke per attempt:
   pointerdown starts a path, pointermove extends it, pointerup ends it
   and triggers analysis.
--------------------------------------------------------------------- */
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let strokePoints = [];
let isDrawing = false;

function resizeCanvasToDisplaySize(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvasToDisplaySize);

function resetDrawingCanvas(){
  resizeCanvasToDisplaySize();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokePoints = [];
  isDrawing = false;
}

function canvasLocalPoint(evt){
  const rect = canvas.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

function onPointerDown(evt){
  if(document.body.getAttribute('data-state') !== 'drawing') return;
  evt.preventDefault();
  canvas.setPointerCapture(evt.pointerId);
  isDrawing = true;
  strokePoints = [canvasLocalPoint(evt)];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function onPointerMove(evt){
  if(!isDrawing) return;
  evt.preventDefault();
  strokePoints.push(canvasLocalPoint(evt));
  redrawStroke();
}

function onPointerUp(evt){
  if(!isDrawing) return;
  if(evt) {
    evt.preventDefault();
    if(canvas.hasPointerCapture(evt.pointerId)) canvas.releasePointerCapture(evt.pointerId);
  }
  isDrawing = false;
  // Require a minimally meaningful stroke before analyzing;
  // otherwise treat it as a mis-click and stay in drawing state.
  if(strokePoints.length < 15){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokePoints = [];
    return;
  }
  setGameState('analyzing');
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);

function redrawStroke(){
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  ctx.beginPath();
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#5eead4';
  ctx.shadowColor = 'rgba(94,234,212,0.8)';
  ctx.shadowBlur = 12;
  strokePoints.forEach((p, i) => {
    if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
}

/* ---------------------------------------------------------------------
   8. CIRCLE ACCURACY ALGORITHM
   Pure geometric scoring, no ML. Given the raw mouse path, we estimate
   how close it is to a perfect circle using four signals:

   a) RADIUS CONSISTENCY — compute the centroid of all points, then the
      distance (radius) from each point to that centroid. A perfect
      circle has zero variance in these radii. We convert the
      coefficient of variation (stdDev / mean) into a 0-1 "shapeScore".

   b) ANGULAR COVERAGE — a small scribble or a short arc can have very
      low radius variance but isn't a circle at all. We sort points by
      angle around the centroid and find the largest *uncovered* gap;
      a full loop leaves no large gap, a partial arc does.

   c) CLOSURE — how close the stroke's start and end points are,
      relative to the circle's own radius. A closed loop should start
      and end near the same spot.

   d) MINIMUM SIZE — extremely tiny circles/dots are rejected so the
      player can't "cheat" with a pinpoint click.

   Final score = shapeScore * coverageRatio^1.4 * (1 - closurePenalty)
   clamped to 0-100 and rounded to the nearest integer.
--------------------------------------------------------------------- */
function calculateCircleAccuracy(points){
  if(points.length < 15){
    return 0;
  }

  // --- centroid -----------------------------------------------------
  let cx = 0, cy = 0;
  points.forEach(p => { cx += p.x; cy += p.y; });
  cx /= points.length;
  cy /= points.length;

  // --- radius consistency --------------------------------------------
  const radii = points.map(p => Math.hypot(p.x - cx, p.y - cy));
  const meanRadius = radii.reduce((a, b) => a + b, 0) / radii.length;
  if(meanRadius < 24) return 0; // reject pinpoint/near-zero-size marks

  const variance = radii.reduce((sum, r) => sum + (r - meanRadius) ** 2, 0) / radii.length;
  const stdDev = Math.sqrt(variance);
  const coefficientOfVariation = stdDev / meanRadius; // 0 = perfect circle
  const shapeScore = Math.max(0, 1 - coefficientOfVariation * 2.3);

  // --- angular coverage ------------------------------------------------
  const angles = points
    .map(p => Math.atan2(p.y - cy, p.x - cx))
    .sort((a, b) => a - b);
  let largestGap = 0;
  for(let i = 1; i < angles.length; i++){
    largestGap = Math.max(largestGap, angles[i] - angles[i - 1]);
  }
  // wrap-around gap between the last and first angle
  largestGap = Math.max(largestGap, (angles[0] + 2 * Math.PI) - angles[angles.length - 1]);
  const coverageRatio = Math.max(0, (2 * Math.PI - largestGap) / (2 * Math.PI));

  // --- closure --------------------------------------------------------
  const first = points[0];
  const last = points[points.length - 1];
  const closureDistance = Math.hypot(first.x - last.x, first.y - last.y);
  const closurePenaltyRatio = Math.min(closureDistance / meanRadius, 1);

  // --- combine ----------------------------------------------------------
  const rawScore = shapeScore * Math.pow(coverageRatio, 1.4) * (1 - 0.35 * closurePenaltyRatio);
  return Math.round(Math.max(0, Math.min(100, rawScore * 100)));
}

const UNLOCK_THRESHOLD = 70; // percent, per spec section 4/5

/* ---------------------------------------------------------------------
   9. RESULT / ANALYSIS FLOW
--------------------------------------------------------------------- */
const resultTitleEl = document.getElementById('resultTitle');
const resultScoreEl = document.getElementById('resultScore');
const btnTryAgain = document.getElementById('btnTryAgain');

const FAIL_LINES = ["Almost there!", "ลองอีกครั้งนะ!", "อีกนิดเดียว!"];

function runCircleAnalysis(){
  // Small delay so the "ANALYZING..." state is perceptible, then reveal.
  const score = calculateCircleAccuracy(strokePoints);
  setTimeout(() => revealResult(score), 900);
}

function revealResult(score){
  const success = score >= UNLOCK_THRESHOLD;

  if(success){
    setGameState('success');
    setMascotState('success');
    setUnlockState('unlocked');
    resultTitleEl.textContent = 'UNLOCKED!';
    resultTitleEl.className = 'success';
    resultScoreEl.innerHTML = 'You unlocked my power! &nbsp; <b>' + score + '%</b> CIRCLE ACCURACY';
    btnTryAgain.textContent = 'PLAY AGAIN';
    launchConfetti();
  } else {
    setGameState('fail');
    setMascotState('fail');
    setUnlockState('locked');
    const line = FAIL_LINES[Math.floor(Math.random() * FAIL_LINES.length)];
    resultTitleEl.textContent = line;
    resultTitleEl.className = 'fail';
    resultScoreEl.innerHTML = 'CIRCLE ACCURACY: &nbsp;<b>' + score + '%</b> &nbsp; (need ' + UNLOCK_THRESHOLD + '%+)';
    btnTryAgain.textContent = 'TRY AGAIN';
  }
}

function launchConfetti(){
  const layer = document.getElementById('confettiLayer');
  const colors = ['#5eead4', '#17b6a4', '#f2a65a', '#eafbf7'];
  for(let i = 0; i < 34; i++){
    const el = document.createElement('div');
    const size = 5 + Math.random() * 6;
    el.style.position = 'absolute';
    el.style.left = '50%';
    el.style.top = '20%';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 220;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 40;
    el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 220}px) scale(0.4)`, opacity: 0 },
    ], { duration: 1200 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.3,1)' });
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
}

/* ---------------------------------------------------------------------
   10. WIRING
--------------------------------------------------------------------- */
document.getElementById('btnStart').addEventListener('click', () => {
  setGameState('drawing');
});

btnTryAgain.addEventListener('click', () => {
  setGameState('drawing');
});

// Kick off the experience.
setGameState('intro');
